name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # this image ships with the Android SDK preinstalled
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log || {
            msg=$(grep -E "^e: |What went wrong|error:|Could not|> " build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ClipAI-apk
          path: app/build/outputs/apk/debug/*.apk
